<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta — Simuladores</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* Variables de respaldo: imitan las del anfitrión donde se mostró la maqueta. */
:root{color-scheme:light;
--bg-primary:#ffffff;--surface-1:#f4f3ef;--surface-2:#ffffff;
--text-primary:#1c1c1e;--text-secondary:#6b6b66;--text-muted:#8e8e88;
--text-accent:#2563eb;--text-success:#15803d;--text-warning:#b45309;--text-danger:#b91c1c;
--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.24);--border-accent:#2563eb;--border-danger:#dc2626;--border-warning:#d97706;
--bg-accent:#dbe7fd;--bg-accent-muted:#eef3fe;--bg-success:#dcfce7;--bg-warning:#fef3c7;--bg-danger:#fee2e2;
--fill-accent:#2563eb;--fill-success:#16a34a;--fill-warning:#d97706;--fill-danger:#dc2626;--fill-ghost-selected:rgba(0,0,0,.06);
--on-accent:#ffffff;--radius:8px;
--font-sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--font-voice:Georgia,"Source Serif 4",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg-primary:#1c1c1e;--surface-1:#242426;--surface-2:#2c2c2e;
--text-primary:#f5f5f0;--text-secondary:#a0a09a;--text-muted:#7c7c76;
--text-accent:#7aa7ff;--text-success:#4ade80;--text-warning:#fbbf24;--text-danger:#f87171;
--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.24);--border-accent:#7aa7ff;
--bg-accent:#1e3a6e;--bg-accent-muted:#1a2740;--bg-success:#14532d;--bg-warning:#4a3410;--bg-danger:#4c1d1d;
--fill-ghost-selected:rgba(255,255,255,.08)}}
body{margin:0;padding:24px 16px;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.5}
main{max-width:1100px;margin:0 auto}
.encabezado{margin:0 0 14px}.encabezado h1{font-size:18px;font-weight:600;margin:0}
.encabezado p{margin:4px 0 0;color:var(--text-secondary);font-size:12px}
button{font:inherit;color:var(--text-primary);background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:var(--radius);cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<style>
/* La metáfora de Simuladores: El laboratorio: el catálogo a la izquierda, las curvas que se mueven al arrastrar los parámetros y las verificaciones contra la teoría al pie. Mueve G o M. Acento propio #65a30d; en la app el color sale del tema de KDE. */
.nota-maqueta{color:var(--text-secondary);font-size:13px;margin:0 0 12px;max-width:820px}
.win{border:0.5px solid var(--border);border-radius:12px;overflow:hidden;font-size:12px;background:var(--surface-2);box-shadow:0 8px 30px rgb(0 0 0 / .10)}
.tit{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:0.5px solid var(--border);background:var(--surface-1)}
.mut{color:var(--text-secondary);font-size:11px}
.row{display:flex;align-items:center;gap:6px}
.btn{font-size:11px;padding:3px 9px}
.pane{border-right:0.5px solid var(--border);padding:8px;overflow:hidden}
.dt{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
</style>
</head>
<body>
<main>
<header class="encabezado"><h1>Maqueta — Simuladores</h1>
<p>Aprobada el 2026-11-18 (versión «identidad propia»).</p></header>
<p class="nota-maqueta">El laboratorio: el catálogo a la izquierda, las curvas que se mueven al arrastrar los parámetros y las verificaciones contra la teoría al pie. Mueve G o M.</p>
<div id="vista" aria-label="Ventana de Simuladores"></div>
</main>
<script>
const A={"simuladores": "#65a30d"};
const el=id=>document.getElementById(id);
const tb=(c,t,extra)=>`<div class="tit"><i class="ti ${t[0]}" style="color:${c};font-size:15px" aria-hidden="true"></i><span style="font-weight:500">${t[1]}</span>${extra||""}</div>`;
const vista=c=>`<div class="win">${tb(c,["ti-math-function","Simuladores"],`<span class="mut">Macroeconomía › IS-LM</span><span style="flex:1"></span><button class="btn">Recorrido guiado</button><button class="btn">Ficha</button>`)}
<div style="display:grid;grid-template-columns:130px minmax(0,1fr) 170px">
<div class="pane">${[["Macro",["IS-LM","Mundell-Fleming","Solow","Ramsey"]],["Estadística",["TCL","Bootstrap"]]].map(d=>`<div class="mut" style="margin:4px 0">${d[0]}</div>${d[1].map(m=>`<div style="padding:2px 6px;border-radius:4px;${m==="IS-LM"?`background:${c}22;color:${c}`:""}">${m}</div>`).join("")}`).join("")}</div>
<div class="pane"><svg id="islm" viewBox="0 0 300 200" width="100%" height="200" role="img"><title>Curvas IS y LM</title></svg><div class="row" id="res" style="justify-content:center;gap:14px"></div></div>
<div style="padding:10px"><label class="mut">Gasto público G <b id="gv"></b></label><input type="range" id="G" min="60" max="200" step="10" value="120" style="width:100%"><label class="mut">Oferta monetaria M <b id="mv"></b></label><input type="range" id="M" min="250" max="550" step="10" value="400" style="width:100%"><div class="mut" style="margin-top:6px">Recalcula en vivo</div></div></div>
<div class="row" style="border-top:0.5px solid var(--border);padding:6px 10px;gap:12px"><span style="color:var(--text-success)">✓ multiplicador 1/(1−c)</span><span style="color:var(--text-success)">✓ equilibrio en la intersección</span><span class="mut">Hicks (1937); Mankiw, cap. 11</span></div></div>`;
function islm(){const G=+el("G").value,M=+el("M").value,m=2.5,b=25,A=280,k=0.5,h=50;const Y=(m*(A+G)+m*b*M/h)/(1+m*b*k/h),r=(k*Y-M)/h;const X=y=>30+(y-600)/600*260,Yp=v=>180-v/8*170;const is=y=>(A+G)/b-y/(m*b),lm=y=>(k*y-M)/h;const c=A.simuladores||"#65a30d";let s=`<line x1="30" y1="180" x2="295" y2="180" stroke="var(--border-strong)"/><line x1="30" y1="5" x2="30" y2="180" stroke="var(--border-strong)"/><text x="292" y="194" font-size="9" text-anchor="end" fill="var(--text-secondary)">Y</text><text x="20" y="12" font-size="9" fill="var(--text-secondary)">r</text>`;const seg=(f,col,lab)=>{let p=[];for(let y=600;y<=1200;y+=20){const v=f(y);if(v>=0&&v<=8)p.push(`${X(y).toFixed(1)},${Yp(v).toFixed(1)}`)}return `<polyline points="${p.join(" ")}" fill="none" stroke="${col}" stroke-width="2"/>`+(p.length?`<text x="${p[p.length-1].split(",")[0]}" y="${+p[p.length-1].split(",")[1]-4}" font-size="10" fill="${col}">${lab}</text>`:"")};s+=seg(is,"#65a30d","IS")+seg(lm,"#0d9488","LM");if(r>=0&&r<=8)s+=`<line x1="${X(Y)}" y1="${Yp(r)}" x2="${X(Y)}" y2="180" stroke="var(--border-strong)" stroke-dasharray="3 3"/><circle cx="${X(Y)}" cy="${Yp(r)}" r="4" fill="var(--text-primary)"/>`;el("islm").innerHTML=s;el("gv").textContent=G;el("mv").textContent=M;el("res").innerHTML=`<span>Y* = <b>${Math.round(Y)}</b></span><span>r* = <b>${r.toFixed(1)} %</b></span>`}
el("vista").innerHTML=vista("#65a30d");
el("G").oninput=islm;el("M").oninput=islm;islm();
</script>
</body>
</html>
